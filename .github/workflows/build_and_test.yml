name: Build and Test Wheels (Self-Hosted)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allows manual execution from the GitHub Actions UI

jobs:
  build-and-test:
    name: Native Build & Test Execution
    # Routes the job to your specific self-hosted machine
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Pixi Environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.71.3
          post-cleanup: true
          pixi-bin-path: ${{ github.workspace }}/.pixi-bin/pixi

      - name: Generate Core Serialization Mappings
        run: pixi run codegen

      - name: Verify Configuration Manifest Formatting (TOML)
        run: pixi run toml-fmt-check

      - name: Verify Python Code Layout (Ruff)
        run: pixi run py-fmt-check

      - name: Verify Rust Workspace Code Layout (Cargo Fmt)
        run: pixi run lint-rs-all

      - name: Verify Code Generation Synchronization (Codegen)
        run: pixi run lint-codegen

      - name: Verify Custom Repository Formatting Conventions
        run: pixi run lint-rerun

      - name: Clean Previous Builds
        # Ensures no stale artifacts from previous runner executions interfere
        run: rm -rf dist/ target/wheels/

      - name: Build Rerun viewer CLI and python sdk wheel
        # 1. Provision the cross-compilation runtime for Pixi
        # 2. Run the full native + web macro task
        run: |
          pixi run py-build-wheel

      - name: Save Compiled Wheel as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rerun-sdk-selfhosted-wheel
          path: target/wheels/*.whl

      - name: Run Cargo Tests (Rust Core)
        # Validates the native Rust crate logic before testing Python integrations
        run: pixi run cargo nextest run --workspace --all-features

      - name: Run Pytest (Python Integrations)
        # Installs dependencies and validates the local Python package bindings
        run: |
          pixi run py-test
